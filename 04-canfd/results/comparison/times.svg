<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="274" viewBox="0 0 1000 274" font-family="Helvetica, Arial, sans-serif" font-size="13">
<rect width="1000" height="274" fill="#ffffff"/>
<text x="10" y="26" font-size="15" font-weight="bold">Time to move the same 64 KiB over a real CAN bus (median, lower is faster)</text>
<text x="10" y="74"><tspan font-weight="bold">C5</tspan> Classic, 8 B/frame, 500 kbps</text>
<rect x="330" y="60" width="550.0" height="20" fill="#98a2b3"/>
